# DIA Cardano Oracle — unified feeder + CLI compose.
#
# Build context is the parent offchain/ directory so both packages are visible.
# Profiles:
#
#   sqlite      — feeder daemon, SQLite persistence
#   postgres    — feeder daemon, PostgreSQL persistence
#   cli         — on-demand CLI admin container (short-lived)
#   monitoring  — Prometheus + Grafana stack
#
# Network-scoped project: the Makefile runs every command with
# `-p dia-feeder-<network>` (network from feeder/.env CARDANO_NETWORK), so
# Preview and Mainnet get separate containers (dia-feeder-<network>-feeder-sqlite-1)
# AND separate named volumes (dia-feeder-<network>_grafana-data, …) and never
# clobber each other. Ports are shared, so run one network at a time. Always
# drive this through `make` — running `docker compose` here without `-p` lands
# everything in one shared project and defeats that isolation.
#
# Common usage:
#   make up                          (from offchain/ — preferred)
#   make up MONITORING=1
#   make cli CMD="protocol"
#   make help
#   docker compose -p dia-feeder-preview --profile sqlite up -d   (raw, if you must)

services:
  feeder-sqlite:
    profiles: ["sqlite"]
    # tini as PID 1 forwards SIGINT/SIGTERM to node. Without it node runs as
    # PID 1, where the kernel ignores default signal dispositions, so Ctrl+C
    # and `docker compose stop` do nothing.
    init: true
    build:
      context: ..
      dockerfile: feeder/Dockerfile
      target: runtime
    image: dia-cardano-feeder:local
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config:ro
      - ./state:/app/state
    env_file: [.env]
    environment:
      DATABASE_DRIVER: sqlite
      # RUN_ID selects the per-run state dir state/<network>_run_<RUN_ID>/.
      # Empty -> the daemon uses the newest run dir (else the flat state/<network>).
      RUN_ID: ${RUN_ID:-}
      # DATABASE_PATH is intentionally NOT set here: the daemon derives it from
      # the active run dir (state/<network>_run_<id>/feeder.sqlite). Setting
      # DATABASE_PATH_TESTNET/MAINNET would pin a fixed path and defeat per-run.
      # CARDANO_FEEDER_CLI_DIST_ROOT already set by Dockerfile ENV.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  feeder-postgres:
    profiles: ["postgres"]
    init: true
    build:
      context: ..
      dockerfile: feeder/Dockerfile
      target: runtime
    image: dia-cardano-feeder:local
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config:ro
      - ./state:/app/state
    env_file: [.env]
    environment:
      DATABASE_DRIVER: postgres
      RUN_ID: ${RUN_ID:-}
      # DATABASE_DSN_PREVIEW and DATABASE_DSN_MAINNET come from .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    profiles: ["postgres"]
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: feeder
      POSTGRES_USER: feeder
      POSTGRES_PASSWORD: feeder
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feeder -d feeder"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Short-lived on-demand CLI container. Invoke via:
  #   docker compose --profile cli run --rm cli <command>
  #   make cli CMD="<command>"
  cli:
    profiles: ["cli"]
    # tini as PID 1 so Ctrl+C (SIGINT) actually aborts the CLI command.
    init: true
    build:
      context: ..
      dockerfile: feeder/Dockerfile
      target: runtime
    image: dia-cardano-feeder:local
    user: "${UID:-1000}:${GID:-1000}"
    entrypoint: ["dia-cli"]
    command: ["help"]
    volumes:
      - ./config:/app/config
      - ./state:/app/state
    env_file: [.env]
    stdin_open: true
    tty: true

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-admin-api"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Headless renderer used by the M2 evidence packaging script to
      # snapshot the dashboard as PNG. Points at the renderer sidecar
      # service below (only active under the `monitoring` profile).
      GF_RENDERING_SERVER_URL: "http://renderer:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://grafana:3000/"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  renderer:
    profiles: ["monitoring"]
    image: grafana/grafana-image-renderer:3.10.5
    restart: unless-stopped
    environment:
      ENABLE_METRICS: "true"

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
