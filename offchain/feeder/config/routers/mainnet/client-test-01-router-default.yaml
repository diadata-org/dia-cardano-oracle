# Router config - client-test-01 on Cardano Mainnet.
# Generated by: feeder init router
# Edit any value and restart the feeder to pick up the change.

routers:
  client_test_01_router_default:
    id: client_test_01_router_default
    name: client-test-01 -> Cardano Mainnet
    customer_id: customer-test-01
    type: event
    enabled: true
    # Env var holding the Cardano wallet mnemonic seed (from .env).
    private_key_env: CARDANO_WALLET_SEED_MAINNET

    triggers:
      events:
        - IntentRegistered
      conditions:
        - field: ${enrichment.fullIntent.Symbol}
          operator: in
          value:
            - ARS/USDT

    processing:
      datasource: enrichment
      transformations: []
      validationenabled: true

    destinations:
      - cardano:
          network: Mainnet
          client_state_path: ../state/mainnet_run_20260616-074413/clients/client-test-01.json
          protocol_state_path: ../state/mainnet_run_20260616-074413/config-bootstrap.json
        # Push an update as soon as the price moves at least this much. With a
        # single pair the 0.5% gate keeps small moves from adding extra
        # transactions; the cron heartbeat below bounds staleness when flat.
        price_deviation: "0.5%"
        # The cron heartbeat guarantees an update at least this often (the max
        # staleness for the pair), even when the price is flat. Needs cron: true below.
        time_threshold: 1h
        # Enable the cron liveness heartbeat for this destination (Spectra parity);
        # without it, a flat pair would only update on price deviation and could
        # stay stale past time_threshold.
        cron: true
