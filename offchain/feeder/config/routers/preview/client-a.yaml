# Router config — client-a on Cardano Preview.
# Generated by: feeder init client
# Edit any value and restart the feeder to pick up the change.

routers:
  client_a_preview:
    id: client_a_preview
    name: client-a → Cardano Preview
    customer: client-a
    type: event
    enabled: true
    # Env var holding the Cardano wallet mnemonic seed (from .env).
    private_key_env: CARDANO_WALLET_SEED_TESTNET

    triggers:
      events:
        - IntentRegistered
      conditions:
        - field: ${enrichment.fullIntent.Symbol}
          operator: in
          value:
            - BTC/USD
            - ETH/USD
            - USDC/USD
            - USDT/USD
            - DOGE/USD
            - LTC/USD
            - ARB/USD
            - SHIB/USD
            - NEIRO/USD
            - XVG/USD

    processing:
      datasource: enrichment
      transformations: []
      validationenabled: true

    destinations:
      - cardano:
          network: Preview
          client_state_path: ../state/preview_run_20260608-040304/clients/client-a.json
          protocol_state_path: ../state/preview_run_20260608-040304/config-bootstrap.json
        # Push an update as soon as the price moves at least this much. Raised
        # from 0.1% to 0.5% so sporadic small moves stop desyncing the per-pair
        # heartbeats — pairs cluster on the 10m cadence and batch together,
        # lowering fee per pair. Trade-off: on-chain price tracks the source a
        # little less tightly between heartbeats.
        price_deviation: "0.5%"
        # The cron heartbeat guarantees an update at least this often (the max
        # staleness per pair), even when the price is flat. Needs cron: true below.
        time_threshold: 10m
        # Enable the cron liveness heartbeat for this destination (Spectra parity);
        # without it, a flat pair would only update on price deviation and could
        # stay stale past time_threshold.
        cron: true
