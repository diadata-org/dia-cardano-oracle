# Feeder infrastructure config — Cardano Preview ↔ DIA Testnet.
# Loaded automatically when CARDANO_NETWORK=Preview.
#
# Priority rule: YAML values win over env-var equivalents when both are
# present, EXCEPT for secrets (wallet seeds, Blockfrost keys) which live
# exclusively in .env and are never placed in this file.

infrastructure:

  # --------------------------------------------------------------------------
  # database — persistence layer for the processed-events log and chain state.
  # --------------------------------------------------------------------------
  database:
    # driver: "sqlite" (default) or "postgres".
    #   sqlite  → the daemon derives the file from the active per-run state
    #             dir: ../state/preview_run_<id>/feeder.sqlite (DATABASE_PATH_TESTNET
    #             env overrides). No path is set here.
    #   postgres → requires DATABASE_DSN_TESTNET env var (DSN string).
    # Overrideable via DATABASE_DRIVER env var.
    driver: sqlite

  # --------------------------------------------------------------------------
  # source — the EVM chain the feeder scans for OracleIntent events.
  # --------------------------------------------------------------------------
  source:
    # chain_id: numeric EVM chain ID. Must match an entry in contracts.yaml.
    chain_id: 10050
    # name: human-readable label used in logs.
    name: DIA Testnet
    # rpc_urls: JSON-RPC HTTP endpoints tried in order (failover on error).
    rpc_urls:
      - https://testnet-rpc.diadata.org
    # ws_url: WebSocket endpoint for the --transport ws mode.
    #   The DIA_WS_CREDENTIAL_TESTNET secret from .env is appended
    #   automatically as a path segment.
    ws_url: wss://testnet-rpc.diadata.org
    # start_block: block to begin scanning from on a cold start (no saved
    #   checkpoint). Once the feeder has written a checkpoint the persisted
    #   value takes precedence and this setting is ignored.
    #   Set to a recent block to skip all historical data on first run.
    start_block: 7108000

  # --------------------------------------------------------------------------
  # event_monitor — WebSocket reconnection policy (--transport ws only).
  # --------------------------------------------------------------------------
  event_monitor:
    enabled: true
    # reconnect_interval: wait between reconnect attempts. Accepts "Xs", "Xm".
    reconnect_interval: 5s
    # max_reconnect_attempts: give up and exit after this many consecutive
    #   failures, so the process manager (Docker, systemd) can restart it.
    max_reconnect_attempts: 60

  # --------------------------------------------------------------------------
  # block_scanner — HTTP polling scanner knobs (--transport http only).
  # --------------------------------------------------------------------------
  block_scanner:
    enabled: true
    # scan_interval: idle wait between polling ticks when caught up to HEAD.
    scan_interval: 10s
    # block_range: max blocks per eth_getLogs request.
    block_range: 500
    # confirmations: source blocks kept behind the tip before a range is
    #   treated as final and checkpointed.
    confirmations: 6
    # max_block_gap: max block distance the scanner tolerates before
    #   triggering a backward sync to fill the gap.
    max_block_gap: 5000
    # backward_sync: when true, the scanner detects and backfills missed
    #   block ranges after a reconnect.
    backward_sync: true
    # backfill_chunk_blocks: blocks per chunk during backfill scans
    #   (overrides BACKFILL_CHUNK_BLOCKS=5000 when present).
    backfill_chunk_blocks: 5000
    # head_tracker_interval: Spectra parity — cadence of a dedicated head-tracker
    #   loop separate from the main scan_interval. NOT WIRED in this feeder:
    #   the HTTP scanner refreshes head implicitly each scan tick and the WS
    #   scanner runs head-tracking inline. Reserved for the M3 dedicated
    #   head-tracker goroutine. See [[M3 deferred features]].
    # head_tracker_interval: 5s
    # gap_detection_interval: Spectra parity — cadence of a dedicated
    #   gap-detection loop. NOT WIRED: gap recovery in this feeder triggers
    #   inline when `head - cursor > max_block_gap` is observed during the
    #   normal scan tick. Reserved for the M3 dedicated gap-detection loop.
    # gap_detection_interval: 30s

  # --------------------------------------------------------------------------
  # event_processor — dedup cache + lane coalescing.
  # --------------------------------------------------------------------------
  event_processor:
    # dedup_cache_size: max entries in the in-memory LRU dedup set.
    dedup_cache_size: 4096
    # dedup_cache_ttl: how long an intentHash is remembered to suppress
    #   re-processing. Must outlive any realistic re-org window.
    dedup_cache_ttl: 1h
    # coalesce_window: accumulation window before a lane flushes its first
    #   buffered batch. New intents arriving while a tx is in flight are
    #   flushed immediately after confirmation with no extra wait. Wider window
    #   = more eligible pairs gather into one batch (lower fee/pair) at the cost
    #   of up to this much added latency on the first batch out of an idle lane.
    coalesce_window: 30s
    # max_intent_age: drop buffered intents older than this at flush time.
    #   Omit to disable age-based dropping.
    max_intent_age: 15m
    # max_batch_size: max symbols included in one Cardano batch update tx.
    #   Larger flushes are split into successive submissions.
    max_batch_size: 10
    # size_fallback_enabled: if a batch still exceeds protocol limits, split
    #   it into smaller chunks and retry automatically.
    size_fallback_enabled: true
    # enable_parallel_mode: when true, an EventWorkerPool processes events
    #   concurrently (enrichment + routing). Cardano submissions still go
    #   through the serial coalescer+queue per lane so EUTxO contention is
    #   avoided. False keeps the sequential default — sufficient for
    #   current Preview/Mainnet throughput. WIRED and tested when enabled.
    enable_parallel_mode: false
    # parallel_worker_count: max concurrent enrichment workers when
    #   enable_parallel_mode=true. ACTIVE only with parallel mode on.
    parallel_worker_count: 4
    # parallel_queue_size: in-memory queue depth for pending events.
    #   Events submitted past this depth are dropped (visible in metric
    #   `worker_tasks_dropped_total{pool_type="event"}`).
    parallel_queue_size: 256
    # parallel_timeout: per-event wall-clock budget. Workers cancel and
    #   count a failure past this point. Accepts "Xs", "Xms", "Xm".
    parallel_timeout: 30s

  # --------------------------------------------------------------------------
  # worker_pool — submission queue knobs.
  #
  # NOTE on Cardano vs Spectra: Spectra creates a worker pool per router
  # with N concurrent workers (`max_workers`, `task_queue_size`). On Cardano
  # the EUTxO model forces per-receiver serialization, so we use a "lane"
  # model: one serial queue per (client, receiver). Cross-lane parallelism
  # comes from running multiple lanes (multiple clients), not multiple
  # workers within a lane. `max_workers` / `task_queue_size` therefore do
  # not apply here and are intentionally absent.
  # --------------------------------------------------------------------------
  worker_pool:
    # max_workers: Spectra parity — max concurrent submission workers per
    #   router pool. WIRED via UpdateWorkerPoolManager: each router gets a
    #   pool with this many workers; the workers drain into the shared
    #   coalescer+queue (which serialises submissions per Cardano lane), so
    #   max_workers raises ingest throughput from the daemon's event loop
    #   but never breaks lane safety. Default 4.
    max_workers: 4
    # task_queue_size: depth of each router's pending-task queue. Tasks
    #   submitted past this depth increment `worker_tasks_dropped_total
    #   {pool_type="update"}` and are rejected from `submit()`.
    task_queue_size: 128
    # task_timeout: per-task wall-clock budget inside the update pool. The
    #   worker cancels and reports a failure past this point. Distinct from
    #   `inflight_timeout_ms` (which guards the lane lock once the tx is on
    #   the wire). Accepts "Xs", "Xms", "Xm".
    task_timeout: 60s
    # retry_delay: wait before retrying a failed submission.
    retry_delay: 5s
    # max_retries: give up after this many consecutive submission failures
    #   for a single intent.
    max_retries: 3
    # inflight_timeout_ms: how long a submitted tx remains in the in-flight
    #   table (blocking new submissions on the same receiver UTxO) before
    #   the lock is considered stuck and released. No silent default — the
    #   feeder validator rejects load if this is missing.
    #   Unit: milliseconds. 15 min = 900_000 ms.
    inflight_timeout_ms: 900000

  # --------------------------------------------------------------------------
  # health_check — controls the /health/ready probe behaviour.
  # --------------------------------------------------------------------------
  health_check:
    enabled: true
    # check_interval: cadence of the periodic health probe loop.
    #   /health/ready is also evaluated inline on each request.
    #   Also drives the queueManager.totalPending() → healthState.workerQueueDepth
    #   refresher used by the max_queue_size check below.
    check_interval: 30s
    # max_processing_lag: if no IntentRegistered event has been processed
    #   within this window, /health/ready returns 503.
    #   Cardano-feeder extension.
    max_processing_lag: 5m
    # max_queue_size: Spectra parity — when set, /health/ready returns 503
    #   when the submission queue depth exceeds this. WIRED in both sequential
    #   and parallel modes (the daemon polls queueManager.totalPending() on
    #   the check_interval cadence). Omit to disable. Recommended for
    #   production: set ~10× max_workers to surface backpressure early.
    max_queue_size: 40

  # --------------------------------------------------------------------------
  # api — HTTP API server.
  # --------------------------------------------------------------------------
  api:
    enabled: true
    # host: bind address INSIDE the container/process. For Docker this MUST
    #   be 0.0.0.0 — Docker publishes the port against the container's network
    #   interface, so a process bound to 127.0.0.1 is NOT reachable from the
    #   host (health/live, metrics, Grafana scrape all fail). Access from the
    #   host is still gated by the compose port mapping (0.0.0.0:8080->8080).
    #   For a bare local `npm run feeder:dev` you can set 127.0.0.1 instead.
    host: 0.0.0.0
    port: 8080
    # listen_addr: Spectra alias — composite "<host>:<port>" form. The
    #   feeder accepts either `host`+`port` (above) or `listen_addr` for
    #   compatibility with Spectra-shaped configs. When both are present,
    #   `host`+`port` win. NOT WIRED beyond loader-time alias resolution.
    # listen_addr: "127.0.0.1:8080"
    # enable_cors: set true only when the API is consumed from a browser.
    enable_cors: false
    # debug_enabled: when true, GET /debug returns a minimal acknowledgement.
    #   When false or absent /debug returns 404. Never exposes env vars,
    #   paths, or secrets. Leave false in production.
    debug_enabled: false
    readiness:
      max_last_confirmed_age: 15m

  # --------------------------------------------------------------------------
  # metrics — Prometheus exposition.
  # --------------------------------------------------------------------------
  metrics:
    # enabled: exposes GET /metrics in Prometheus text format.
    # Overrideable via METRICS_ENABLED=true env var.
    enabled: true
    # namespace: prefix for every metric name, e.g. dia_bridge_events_detected_total.
    # Overrideable via METRICS_NAMESPACE env var.
    namespace: dia_bridge

  # --------------------------------------------------------------------------
  # cardano — destination-chain confirmation policy.
  # --------------------------------------------------------------------------
  cardano:
    # confirmation_depth: number of Cardano blocks the feeder waits past
    #   the inclusion block before declaring `tx_confirmed`. Default 1 is
    #   practically final for oracle feeds. Higher values trade latency
    #   for rollback safety. The price-cache `confirmedAtDepth` field
    #   exposes whatever value the feeder actually waited.
    confirmation_depth: 1

  # --------------------------------------------------------------------------
  # cron_service — periodic resubmission loop for staleness guarantees.
  #
  # When enabled, the feeder ticks every `tick_interval` and re-submits
  # the latest known intent for any cron-enabled destination whose last
  # on-chain confirm is older than the destination's `time_threshold`.
  # Without this, a pair can stay stale if the router's price-deviation
  # filter drops every event (e.g. the price barely moves for hours).
  #
  # Per-destination opt-in: set `cron: true` and `time_threshold: ...`
  # on the destination in `routers/<router>.yaml`.
  # --------------------------------------------------------------------------
  cron_service:
    enabled: true
    # tick_interval: how often the cron service inspects every cron-enabled
    #   destination. Each destination's own `time_threshold` gates per-pair
    #   cadence; this is just the scan interval. Duration string ("30s", "1m").
    tick_interval: 30s
    # aligned_heartbeat: fire the heartbeat on a shared wall-clock boundary
    #   (floor(now / time_threshold) * time_threshold) so all pairs become due
    #   in the same tick and coalesce into ONE batch every time_threshold,
    #   instead of each pair drifting on its own timer (small, staggered txs).
    #   Lower fee per pair; max staleness unchanged (~time_threshold). Only
    #   affects destinations with time_threshold > 0. Default false.
    aligned_heartbeat: true

  # --------------------------------------------------------------------------
  # alerting — canonical thresholds for both feeder-emitted warnings and
  #   Prometheus alert rules in monitoring/alerts.yml. Every alert rule in
  #   alerts.yml carries an inline comment naming the YAML key here; values
  #   must stay in sync. The feeder code reads these too (e.g. to emit
  #   `dia_bridge_cardano_receiver_topup_warnings_total` when the balance
  #   drops below `receiver_balance_low_lovelace`).
  #
  # Units: balances in lovelace (1 ADA = 1_000_000 lovelace); time in
  #   seconds; deviation in percent (0–100).
  # --------------------------------------------------------------------------
  alerting:
    # Receiver `balanceLovelace` below this value → ReceiverBalanceLow alert
    # and warning counter emitted by the feeder. Action: `receiver:top-up`.
    receiver_balance_low_lovelace: 2000000             # 2 ADA (= 2_000_000 lovelace)
    # Receiver `accruedToHookLovelace` above this value → SettleOverdue
    # alert. Action: CLI `settle` to move fees to the PaymentHook.
    settle_overdue_lovelace: 10000000                  # 10 ADA accrued
    # PaymentHook `accruedFeesLovelace` above this value →
    # PaymentHookWithdrawReady alert. Action: CLI `payment-hook:withdraw`.
    payment_hook_withdraw_ready_lovelace: 50000000     # 50 ADA accumulated
    # Admin (signer) wallet total lovelace below this → AdminWalletLow.
    # Action: refill the operator wallet that pays Cardano tx fees.
    admin_wallet_low_lovelace: 5000000                 # 5 ADA (= 5_000_000 lovelace)
    # Seconds since a symbol was last confirmed on-chain → OraclePairStale.
    oracle_pair_stale_seconds: 3600                    # 1 h
    # p95 of observed price deviation in percent → PriceDeviationHigh
    # (possible misreported price).
    price_deviation_high_percent: 5                    # 5 %
    # p95 of incoming price-data age (seconds at processing time) →
    # PriceAgeHigh (DIA source publishing stale prices).
    price_age_high_seconds: 600                        # 10 min
    # Confirmed-tx reorgs in the last hour above this count → ReorgRateHigh.
    # Prometheus-only (not consumed by feeder code); kept here so every alert
    # threshold has one canonical home (enforced by the threshold-drift test).
    reorg_rate_high_per_hour: 3                         # >3 reorg-dropped txs/1h
    # Sum of un-merged client deposits at a per-client deposit address above
    # this value → ReceiverDepositsPending alert. Action: CLI `deposit:merge`
    # to fold the deposits into the client's Receiver balance. Prometheus-only
    # (not consumed by feeder code); kept here so every alert threshold has one
    # canonical home (enforced by the threshold-drift test).
    deposit_pending_merge_lovelace: 5000000            # 5 ADA of un-merged deposits → run a merge
    # Admin (signer) wallet LARGEST pure-ADA UTxO below this → AdminWalletFragmented
    # alert (critical). A script tx needs a collateral UTxO DISTINCT from its fee
    # inputs; if the wallet shatters into sub-collateral dust the total can still
    # look healthy while every build traps. Action: `wallet:consolidate` (the
    # daemon auto-consolidates below `auto_consolidate_below_lovelace`).
    admin_wallet_min_collateral_lovelace: 10000000     # 10 ADA largest-UTxO floor
    # Cardano API provider health. PRIMARY = the lucid build/submit provider
    # (selected by CARDANO_PROVIDER); if it is down NOTHING can be built and all
    # pairs freeze together (e.g. a Blockfrost 402 quota wall). SECONDARY = the
    # confirmation/reorg redundancy provider; losing it degrades redundancy only.
    # Seconds without a successful call/probe before the alert fires. Measured
    # via `dia_bridge_provider_last_ok_timestamp_seconds{role}`. Prometheus-only.
    provider_primary_unhealthy_seconds: 600            # 10 min → PrimaryProviderDown (critical)
    provider_secondary_unhealthy_seconds: 900          # 15 min → SecondaryProviderDown (warning)

    # --- Automatic remediation thresholds -------------------------------------
    # The feeder ACTS on these itself, on the balance-refresh tick, as a lane
    # task (serialized with updates on the same Receiver). Each MUST sit BEYOND
    # its paired alert so the ALERT fires FIRST and the automatic step only
    # follows if the condition keeps growing (accruals) / shrinking (collateral).
    # The threshold-drift test enforces the ordering — an automatic step that
    # fired at the alert value would make the alert useless.
    # Receiver accrued above this → daemon auto-runs `settle` (> settle_overdue).
    auto_settle_lovelace: 30000000                     # 30 ADA accrued (alert at 10)
    # PaymentHook accrued above this → daemon auto-runs `payment-hook:withdraw`
    # to refill the admin wallet (> payment_hook_withdraw_ready).
    auto_withdraw_lovelace: 100000000                  # 100 ADA accrued (alert at 50)
    # Largest admin-wallet pure-ADA UTxO below this → daemon auto-runs
    # `wallet:consolidate` (< admin_wallet_min_collateral, so the alert fires first).
    auto_consolidate_below_lovelace: 7000000           # 7 ADA largest UTxO (alert at 10)

  # --------------------------------------------------------------------------
  # replica — Spectra parity, HA failover monitor.
  #
  # NOT WIRED in this feeder: types parse cleanly so a Spectra-shaped YAML
  # loads, but no failover logic is active. Multi-instance coordination
  # is reserved for a future milestone — see [[M3 deferred features]].
  # In single-instance deployments leave `enabled: false`.
  # --------------------------------------------------------------------------
  replica:
    enabled: false
    # role: "primary" or "secondary". Only meaningful when enabled=true.
    # role: primary
    # monitor_chain_id: which chain the secondary watches for primary heartbeats.
    # monitor_chain_id: 10050

  # --------------------------------------------------------------------------
  # dry_run — skip actual Cardano submissions for the whole process.
  # --------------------------------------------------------------------------
  # dry_run: when true the feeder runs the full pipeline (scan → enrich →
  #   route) but logs "[dry-run] would submit" instead of building a tx.
  #   Also settable via --dry-run CLI flag or DRY_RUN=true env var.
  #   Any of the three sources being true activates dry-run mode.
  dry_run: false
