# Prometheus alerting rules for the DIA Cardano Oracle feeder.
#
# READING THIS FILE
# -----------------
# Each alert below is written so an operator can act WITHOUT reading any other
# doc. Every `description` states, in plain language: what the metric means,
# why it matters in the protocol's money flow, and the EXACT commands to fix
# it — in BOTH forms:
#   * Docker (recommended; this is how the feeder runs in production):
#       cd offchain && make cli CMD="<verb> ..."      # state paths are /app/offchain/state/...
#   * npm (dev / no Docker), run from offchain/cli, pointing at the live
#     feeder's state tree:
#       cd offchain/cli && npm run cli -- <verb> ...   # state paths are ../state/...
# Both forms act on the SAME on-chain protocol and the SAME state files.
#
# `{{ $labels.run_dir }}` and `{{ $labels.client_id }}` are templated by
# Prometheus from the firing series' labels: `run_dir` is a registry default
# label carrying the active per-run state dir basename (e.g.
# `preview_run_20260608-040304`, or `mainnet_run_…` on Mainnet), so the
# remediation commands resolve to the real, complete state path — nothing to
# fill in by hand. `client_id` is the affected client.
#
# THE MONEY FLOW (needed to understand AdminWalletLow / SettleOverdue / etc.)
# --------------------------------------------------------------------------
# Per-update fee is debited from the client's Receiver and accrues, then is
# swept to the global PaymentHook, then withdrawn to the operator wallet:
#
#   client tops up Receiver.balance   (receiver:top-up — prepaid pool)
#        every price update: AccrueFee  -> Receiver.balance  -=fee
#                                          Receiver.accrued  +=fee
#        settle                          -> Receiver.accrued -> PaymentHook.accrued
#        payment-hook:withdraw           -> PaymentHook.accrued -> withdraw_address
#                                                              (= the Admin wallet)
#
# So the Admin (signer/operator) wallet is REPLENISHED by collecting protocol
# revenue (settle + payment-hook:withdraw) — NOT by sending it ADA from
# outside. External funding is only a fallback when there is no accrued
# revenue to collect.
#
# THRESHOLDS
# ----------
# infrastructure.<network>.yaml::alerting.* is the SINGLE SOURCE OF TRUTH for
# every threshold below. This file mirrors those values; the drift test
# (src/config/__tests__/threshold-drift.test.ts, run by `npm test` or
# `make check-thresholds`) FAILS if any value here — or any Grafana panel
# threshold — diverges from the YAML. Edit the YAML, then update this file and
# the dashboard to match.
#
# Balance/lovelace metrics are divided by 1_000_000 in `expr` so the comparison
# and the displayed {{ $value }} are in ADA. Each ADA threshold is the canonical
# lovelace key in alerting.<key> divided by 1_000_000:
#   receiver_balance_low_lovelace        = 2_000_000  -> 2 ADA
#   settle_overdue_lovelace              = 10_000_000 -> 10 ADA
#   payment_hook_withdraw_ready_lovelace = 50_000_000 -> 50 ADA
#   admin_wallet_low_lovelace            = 5_000_000  -> 5 ADA
#   deposit_pending_merge_lovelace       = 5_000_000  -> 5 ADA
# Non-lovelace keys are used verbatim:
#   oracle_pair_stale_seconds = 3600   price_age_high_seconds = 600
#   price_deviation_high_percent = 5   reorg_rate_high_per_hour = 3
# The README "Thresholds and alerts" table is the operator-facing summary.

groups:
  - name: feeder
    rules:
      # ---------------------------------------------------------------------
      - alert: OraclePairStale
        expr: >
          (time() - dia_bridge_cardano_oracle_last_confirmed_timestamp_seconds) > 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Oracle pair {{ $labels.symbol }} has stopped updating on-chain"
          description: >
            Pair {{ $labels.symbol }} has not had a confirmed Cardano update for
            {{ $value | humanizeDuration }} (alert fires after 1 hour). The
            feeder is no longer landing price updates for this pair on-chain, so
            consumers read an increasingly stale price.

            WHY: an update lands on-chain only if (a) the client's Receiver has
            ADA to pay the per-update fee, (b) the operator (Admin) wallet has
            ADA to pay the network fee, and (c) the DIA source is still
            publishing this symbol. This alert does not say which of the three
            failed — work down the list.

            WHAT TO DO:
            1. Read the running feeder's logs and look for {{ $labels.symbol }}
               together with "Insufficient", "error", or "failed":
                 cd offchain && make logs
            2. Most common: the Receiver ran out of ADA (see ReceiverBalanceLow).
               Top it up with 5 ADA:
                 Docker: cd offchain && make cli CMD="deposit:address --protocol-state /app/offchain/state/{{ $labels.run_dir }}/config-bootstrap.json --client-state /app/offchain/state/{{ $labels.run_dir }}/clients/{{ $labels.client_id }}.json"
                 npm:    cd offchain/cli && npm run cli -- deposit:address --protocol-state ../state/{{ $labels.run_dir }}/config-bootstrap.json --client-state ../state/{{ $labels.run_dir }}/clients/{{ $labels.client_id }}.json
               Then send client ADA to that deposit address. The feeder will
               merge/fold it into the Receiver automatically; `receiver:top-up`
               is still available as an operator-only fallback.
            3. Next: the Admin (signer) wallet may be empty — see AdminWalletLow
               for how to replenish it by collecting accrued fees.
            4. If both wallets have ADA and the logs show no submit error, the
               DIA source likely stopped publishing this symbol — see
               PriceAgeHigh.

      # ---------------------------------------------------------------------
      - alert: ReceiverBalanceLow
        expr: >
          dia_bridge_cardano_receiver_balance_lovelace / 1000000 < 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Receiver prepaid balance for client {{ $labels.client_id }} is below 2 ADA"
          description: >
            The Receiver for client {{ $labels.client_id }} holds
            {{ $value | printf "%.2f" }} ADA of spendable balance (alert fires
            below 2 ADA).

            Client Receiver address (on {{ $labels.network }}, view on a block explorer):
              {{ $labels.receiver_address }}
            Client deposit address to fund:
              {{ $labels.deposit_address }}

            WHY / WHOSE MONEY: the Receiver is THE CLIENT'S PREPAID FEE POOL —
            the same model as the EVM side. The client prepays ADA into it and
            consumes prices off-chain; this balance pays the protocol fee
            (base_fee + n*per_pair_fee) on every update. When it hits zero,
            updates for this client stop with "ReceiverInsufficientFunds" and
            OraclePairStale follows. (The "accrued" bucket already collected is
            separate and cannot pay new fees — only this spendable balance can.)
            So topping it up is the CLIENT'S responsibility; the operator can do
            it on the client's behalf and bill it, but the ADA is the client's.

            HOW TO FUND IT — IMPORTANT: do NOT send ADA directly to the Receiver
            address above. It is a script UTxO; a plain transfer there does
            nothing useful and can be stranded.

            Preferred path: send ADA to the client's deposit address shown above.
            You can also verify it from the client artifact or print it with:
              Docker: cd offchain && make cli CMD="deposit:address --protocol-state /app/offchain/state/{{ $labels.run_dir }}/config-bootstrap.json --client-state /app/offchain/state/{{ $labels.run_dir }}/clients/{{ $labels.client_id }}.json"
              npm:    cd offchain/cli && npm run cli -- deposit:address --protocol-state ../state/{{ $labels.run_dir }}/config-bootstrap.json --client-state ../state/{{ $labels.run_dir }}/clients/{{ $labels.client_id }}.json

            After the client sends ADA there, the feeder automatically folds it
            into Receiver balance by update-fold or auto-merge. Operator
            fallback, if you must top up directly from the configured wallet
            (amount is lovelace; 5000000 = 5 ADA):
              Docker: cd offchain && make cli CMD="receiver:top-up --amount-lovelace 5000000 --protocol-state /app/offchain/state/{{ $labels.run_dir }}/config-bootstrap.json --client-state /app/offchain/state/{{ $labels.run_dir }}/clients/{{ $labels.client_id }}.json"
              npm:    cd offchain/cli && npm run cli -- receiver:top-up --amount-lovelace 5000000 --protocol-state ../state/{{ $labels.run_dir }}/config-bootstrap.json --client-state ../state/{{ $labels.run_dir }}/clients/{{ $labels.client_id }}.json
            The alert clears within ~1 minute after funds are merged/top-up confirms.

      # ---------------------------------------------------------------------
      - alert: SettleOverdue
        expr: >
          dia_bridge_cardano_receiver_accrued_lovelace / 1000000 > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Client {{ $labels.client_id }} has over 10 ADA of accrued fees waiting to settle"
          description: >
            The Receiver for client {{ $labels.client_id }} has accrued
            {{ $value | printf "%.2f" }} ADA of protocol fees (alert fires above
            10 ADA).

            WHY: each update moves the fee from the Receiver's balance into its
            "accrued" bucket (AccrueFee). Those fees sit in the Receiver until an
            admin "settle" sweeps them into the global PaymentHook, from where
            they can be withdrawn as protocol revenue. Letting accrued grow
            unbounded delays revenue collection and keeps lovelace locked in the
            Receiver UTxO. Settling is safe and idempotent (it never touches the
            spendable balance).

            WHAT TO DO — run a settle for this client (sweeps accrued -> PaymentHook):
              Docker: cd offchain && make cli CMD="settle --protocol-state /app/offchain/state/{{ $labels.run_dir }}/config-bootstrap.json --client-state /app/offchain/state/{{ $labels.run_dir }}/clients/{{ $labels.client_id }}.json"
              npm:    cd offchain/cli && npm run cli -- settle --protocol-state ../state/{{ $labels.run_dir }}/config-bootstrap.json --client-state ../state/{{ $labels.run_dir }}/clients/{{ $labels.client_id }}.json
            After it confirms, the accrued bucket is 0 and the alert clears. To
            then turn that into spendable revenue, withdraw from the PaymentHook
            (see PaymentHookWithdrawReady).

      # ---------------------------------------------------------------------
      - alert: PaymentHookWithdrawReady
        expr: >
          dia_bridge_cardano_payment_hook_accrued_lovelace / 1000000 > 50
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "PaymentHook holds over 50 ADA of collected fees — ready to withdraw"
          description: >
            The global PaymentHook holds {{ $value | printf "%.2f" }} ADA of
            settled protocol fees (alert fires above 50 ADA). Nothing is broken —
            this is accumulated REVENUE ready to be withdrawn.

            WHY: settles from all clients' Receivers accumulate here. Withdrawing
            pays the lovelace to the protocol's configured withdraw_address, which
            in normal operation is the Admin (operator) wallet — so this is also
            how that wallet is replenished to keep paying network fees.

            WHAT TO DO — withdraw the fees. Set --amount-lovelace to how much you
            want (in lovelace; 50000000 = 50 ADA). Check the exact available
            amount on the Grafana "Admin wallet / PaymentHook / Receiver accrued"
            panel or via the dia_bridge_cardano_payment_hook_accrued_lovelace
            metric, and do not request more than is accrued:
              Docker: cd offchain && make cli CMD="payment-hook:withdraw --amount-lovelace 50000000 --protocol-state /app/offchain/state/{{ $labels.run_dir }}/config-bootstrap.json"
              npm:    cd offchain/cli && npm run cli -- payment-hook:withdraw --amount-lovelace 50000000 --protocol-state ../state/{{ $labels.run_dir }}/config-bootstrap.json
            TIMING: run this only after the most recent settle is fully confirmed.
            Firing a withdraw a few seconds after a settle can fail with
            "BadInputsUTxO" because the provider has not yet indexed the new
            wallet/Hook UTxO — wait ~30 s and retry the same command.

      # ---------------------------------------------------------------------
      - alert: AdminWalletLow
        expr: >
          dia_bridge_cardano_admin_wallet_lovelace / 1000000 < 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Admin (operator) wallet is below 5 ADA — all updates will stall"
          description: >
            The Admin (signer/operator) wallet holds {{ $value | printf "%.2f" }}
            ADA (alert fires below 5 ADA). This is the wallet that signs every
            Cardano transaction the feeder submits and PAYS THE NETWORK FEE for
            it. If it empties, NO update for ANY client can be submitted —
            everything stalls.

            WHY / HOW IT IS REFILLED: this wallet's income is the protocol
            revenue itself. Fees flow Receiver -> (settle) -> PaymentHook ->
            (payment-hook:withdraw) -> withdraw_address, and withdraw_address is
            this operator wallet. So the FIRST remedy is to COLLECT accrued
            revenue, not to send ADA from outside.

            WHAT TO DO:
            1. Sweep each client's accrued fees into the PaymentHook (repeat per
               client id you operate):
                 Docker: cd offchain && make cli CMD="settle --protocol-state /app/offchain/state/{{ $labels.run_dir }}/config-bootstrap.json --client-state /app/offchain/state/{{ $labels.run_dir }}/clients/client-a.json"
                 npm:    cd offchain/cli && npm run cli -- settle --protocol-state ../state/{{ $labels.run_dir }}/config-bootstrap.json --client-state ../state/{{ $labels.run_dir }}/clients/client-a.json
            2. Wait ~30 s for the settle to be indexed, then withdraw the
               collected fees from the PaymentHook into this wallet (set the
               amount in lovelace to what the PaymentHook accrued metric shows):
                 Docker: cd offchain && make cli CMD="payment-hook:withdraw --amount-lovelace 50000000 --protocol-state /app/offchain/state/{{ $labels.run_dir }}/config-bootstrap.json"
                 npm:    cd offchain/cli && npm run cli -- payment-hook:withdraw --amount-lovelace 50000000 --protocol-state ../state/{{ $labels.run_dir }}/config-bootstrap.json
            3. FALLBACK ONLY — if there is no accrued revenue to collect (the
               PaymentHook and all Receivers are near zero) and the wallet is
               genuinely empty, fund it from outside. Find its address:
                 grep -A2 '"wallet"' offchain/state/{{ $labels.run_dir }}/config-bootstrap.json
               then fund it: {{ if eq $labels.network "Mainnet" }}send ADA from
               the treasury{{ else }}request test ADA from the Cardano faucet
               (https://docs.cardano.org/cardano-testnets/tools/faucet){{ end }}.

            NOTE: right after a restart this metric can briefly read 0 before the
            feeder reads the real on-chain balance. If you JUST restarted, give it
            a minute before acting — the 5-minute `for:` window usually covers it.

      # ---------------------------------------------------------------------
      - alert: AdminWalletFragmented
        expr: >
          dia_bridge_cardano_admin_wallet_max_utxo_lovelace / 1000000 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Admin wallet has no collateral-capable UTxO — builds will trap"
          description: >
            The Admin (signer) wallet's LARGEST pure-ADA UTxO is
            {{ $value | printf "%.2f" }} ADA (alert fires below 10 ADA). A Cardano
            script tx (every oracle update, settle, withdraw) needs a collateral
            UTxO DISTINCT from its fee inputs. When the wallet shatters into many
            sub-collateral UTxOs the TOTAL balance can still look healthy while
            NO single UTxO can back collateral — every build then traps with
            "RuntimeError: unreachable" and all updates stall. This alert watches
            the largest UTxO precisely because AdminWalletLow (which watches the
            total) is blind to fragmentation.

            WHAT TO DO: consolidate the wallet's dust into one fat UTxO + a
            dedicated collateral UTxO. The feeder AUTO-CONSOLIDATES below
            `alerting.auto_consolidate_below_lovelace` (this alert fires first, at
            a higher value), so usually no action is needed — it self-heals on the
            next balance tick. If you need to force it:
              Docker: cd offchain && make cli CMD="wallet:consolidate"
              npm:    cd offchain/cli && npm run cli -- wallet:consolidate

            NOTE: right after a restart this metric can briefly read 0 before the
            feeder reads the real on-chain balance; the 5-minute `for:` window
            usually covers it.

      # ---------------------------------------------------------------------
      - alert: PriceDeviationHigh
        expr: >
          histogram_quantile(0.95,
            sum by (le, symbol) (
              rate(dia_bridge_price_deviation_percent_bucket[10m])
            )
          ) > 5
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Price for {{ $labels.symbol }} moved more than 5% — possible bad data"
          description: >
            The 95th-percentile price change for {{ $labels.symbol }} is
            {{ $value | printf "%.2f" }}% over the last 10 minutes (alert fires
            above 5%). This is a DATA-QUALITY signal, not a feeder fault — no
            wallet top-up fixes it. It can mean a misreported / outlier price from
            the DIA source, or a genuinely fast market move.

            WHAT TO DO:
            1. Compare {{ $labels.symbol }} against a public reference (CoinGecko,
               Binance, etc.).
            2. If the on-chain value is clearly wrong, stop publishing this pair:
               remove it from the active router YAML under
               offchain/feeder/config/ and restart the feeder
               (cd offchain && make restart), then raise it with the DIA data team.
            3. If it was a real market move, no action is needed; the alert
               clears on its own once volatility subsides.

      # ---------------------------------------------------------------------
      - alert: PriceAgeHigh
        expr: >
          histogram_quantile(0.95,
            sum by (le, symbol) (
              rate(dia_bridge_price_age_seconds_bucket[10m])
            )
          ) > 600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DIA source data for {{ $labels.symbol }} is going stale (upstream)"
          description: >
            The 95th-percentile age of incoming DIA price data for
            {{ $labels.symbol }} is {{ $value | humanizeDuration }} (alert fires
            above 10 minutes). The feeder itself is healthy; the UPSTREAM DIA
            source is delivering old prices for this symbol (or the source
            WebSocket connection is degraded). This is scoped to ROUTED pairs only
            (`dia_bridge_price_age_seconds` is recorded just for symbols this
            feeder publishes, not every symbol the source feed carries).

            WHAT TO DO:
            1. Confirm the feeder is still connected to the DIA source and watch
               for WebSocket reconnect messages near {{ $labels.symbol }}:
                 cd offchain && make logs
            2. If the connection is healthy but the data stays old, the source
               feed is lagging on DIA's side — raise it with the DIA data team.
               There is no operator-side fix; do NOT top up wallets for this.

      # ---------------------------------------------------------------------
      - alert: FeedAccuracyFail
        expr: >
          dia_bridge_feed_sanity_status >= 2
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "On-chain value for {{ $labels.symbol }} disagrees with the DIA source"
          description: >
            The per-feed sanity check rated {{ $labels.symbol }} as BROKEN
            (status 2) for over 10 minutes: the value published on Cardano differs
            from the latest DIA source price beyond the configured tolerance AND is
            stale past its freshness window. This is a DATA-ACCURACY signal — the
            on-chain oracle no longer reflects the DIA source.

            WHAT TO DO:
            1. Inspect the deviation / staleness — query the API or run the
               on-demand check:
                 curl -s localhost:8080/api/v1/alerts
                 cd offchain/feeder && npm run sanity:feeds
            2. Confirm the feeder is still publishing {{ $labels.symbol }} and that
               the DIA source is delivering fresh intents for it:
                 cd offchain && make logs
            3. A feed that stays BROKEN means the on-chain pair stopped tracking the
               source — investigate the submission path for that pair. No wallet
               top-up fixes a data-accuracy fault.

      # ---------------------------------------------------------------------
      - alert: ReorgRateHigh
        expr: >
          increase(dia_bridge_transactions_reorg_total[1h]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cardano reorgs are dropping confirmed updates for {{ $labels.symbol }}"
          description: >
            {{ $value }} confirmed transactions for {{ $labels.symbol }} (client
            {{ $labels.client_id }}) were rolled back by Cardano chain
            reorganisations in the last hour (alert fires above 3). The feeder
            re-submits dropped updates automatically, so this is usually
            self-healing; a sustained high rate points to a lagging chain
            provider (Blockfrost/Koios).

            WHAT TO DO:
            1. Open Grafana (http://localhost:3000) and check the "Scanner block
               lag" panel — a large lag means the provider is behind the tip.
            2. Watch the running feeder for repeated re-submissions:
                 cd offchain && make logs
            3. If the rate stays high, switch the chain provider: set
               CARDANO_PROVIDER in offchain/feeder/.env (e.g. Blockfrost <-> Koios)
               and restart:
                 cd offchain && make restart

      # ---------------------------------------------------------------------
      - alert: ReceiverDepositsPending
        expr: >
          dia_bridge_cardano_deposit_pending_lovelace / 1000000 > 5
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Client {{ $labels.client_id }} has over 5 ADA of un-merged deposits waiting"
          description: >
            The per-client deposit address for client {{ $labels.client_id }}
            holds {{ $value | printf "%.2f" }} ADA of deposits that have not yet
            been folded into the Receiver balance (alert fires above 5 ADA).
            Nothing is broken — this is the client's prepaid funding waiting to
            be applied.

            Client deposit address (on {{ $labels.network }}, view on a block explorer):
              {{ $labels.deposit_address }}

            WHY: clients add prepaid funds by sending ADA to their per-client
            deposit address (side-deposit funding) instead of running
            `receiver:top-up` themselves. Those deposits accumulate there until
            a `deposit:merge` spends them and the current Receiver UTxO together,
            re-creating the Receiver with the deposits folded into its spendable
            balance. Until a merge runs, the deposited ADA cannot pay update fees
            — only the Receiver's spendable balance can (see ReceiverBalanceLow).
            Merging is safe and idempotent; it never touches the accrued bucket.

            WHAT TO DO — run a merge for this client (folds deposits ->
            Receiver balance):
              Docker: cd offchain && make cli CMD="deposit:merge --protocol-state /app/offchain/state/{{ $labels.run_dir }}/config-bootstrap.json --client-state /app/offchain/state/{{ $labels.run_dir }}/clients/{{ $labels.client_id }}.json"
              npm:    cd offchain/cli && npm run cli -- deposit:merge --protocol-state ../state/{{ $labels.run_dir }}/config-bootstrap.json --client-state ../state/{{ $labels.run_dir }}/clients/{{ $labels.client_id }}.json
            After it confirms, the deposit-pending total drops to 0 and the alert
            clears within ~1 minute.

      # ---------------------------------------------------------------------
      - alert: PrimaryProviderDown
        expr: >
          time() - dia_bridge_provider_last_ok_timestamp_seconds{role="primary"} > 600
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Primary Cardano provider ({{ $labels.provider }}) is down — no transactions can be built"
          description: >
            The PRIMARY Cardano API provider ({{ $labels.provider }}, selected by
            CARDANO_PROVIDER) has not answered a successful call for
            {{ $value | printf "%.0f" }} s (alert fires past the configured
            `alerting.provider_primary_unhealthy_seconds` window). This provider
            is what lucid uses to fetch protocol parameters, read UTxOs, build,
            and submit — when it is down NOTHING can be built and EVERY pair
            freezes together (a single point of failure). The classic cause is a
            Blockfrost `402 Payment Required` (the API key hit its quota), or an
            invalid key / provider outage.

            WHAT TO DO:
            1. Check the running feeder for the provider error:
                 cd offchain && make logs
               A "402 Payment Required" means the key's quota is exhausted.
            2. Rotate the key: set BLOCKFROST_PROJECT_ID_<NET> (or KOIOS_API_URL_<NET>)
               in offchain/feeder/.env to a fresh project/key, then restart:
                 cd offchain && make restart
            3. Or switch provider entirely: set CARDANO_PROVIDER in
               offchain/feeder/.env (Blockfrost <-> Koios) and restart. The role
               labels and this alert follow CARDANO_PROVIDER automatically.

      # ---------------------------------------------------------------------
      - alert: SecondaryProviderDown
        expr: >
          time() - dia_bridge_provider_last_ok_timestamp_seconds{role="secondary"} > 900
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Secondary Cardano provider ({{ $labels.provider }}) is down — confirmation/reorg redundancy lost"
          description: >
            The SECONDARY Cardano API provider ({{ $labels.provider }}) has not
            answered a successful liveness probe for {{ $value | printf "%.0f" }} s
            (alert fires past `alerting.provider_secondary_unhealthy_seconds`).
            The secondary backs tx confirmation and reorg checks; the feeder keeps
            operating through the primary, so this is a WARNING, not an outage —
            it means the redundant confirmation/reorg path is unavailable.

            WHAT TO DO:
            1. Check the secondary provider's status / quota.
            2. Fix or rotate its endpoint in offchain/feeder/.env
               (KOIOS_API_URL_<NET> or BLOCKFROST_API_URL_<NET> /
               BLOCKFROST_PROJECT_ID_<NET>), then restart:
                 cd offchain && make restart
            No price updates are at risk while only the secondary is down.
